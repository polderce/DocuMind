[project]
name = "documind"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.0",
    "asyncio>=4.0.0",
    "asyncpg>=0.32.0",
    "fastapi[standard]>=0.143.0",
    "pydantic-settings>=2.15.0",
    "sqlalchemy[asyncio]>=2.1.4",
]

[dependency-groups]
dev = [
    "ruff>=0.17.0",
]

[tool.uv.workspace]
members = [
    "alembic",
]
